name: 构建 Docker 镜像

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: 运行单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 生成版本号
        run: node scripts/gen-version.js

      - name: 运行测试
        run: npm test

  smoke:
    name: 容器启动冒烟测试
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像到本地
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vnts2-ws:smoke
          build-args: |
            SERVER_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 启动容器并验证 /test 可用
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8787:8787 \
            -e LOCAL_PROTOCOL=http-wss-proxy \
            -e NETWORKS=default \
            vnts2-ws:smoke

          echo "等待服务就绪..."
          ok=0
          for i in $(seq 1 60); do
            if curl -sk --max-time 3 "https://127.0.0.1:8787/test?format=json" | grep -q '"WebSocket服务":"正常"'; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" != "1" ]; then
            echo "::error::容器未在超时时间内就绪"
            echo "----- 容器状态 -----"
            docker ps -a --filter name=smoke || true
            echo "----- 容器日志 -----"
            docker logs smoke 2>&1 || true
            exit 1
          fi

          echo "服务已就绪，/test 响应："
          curl -sk "https://127.0.0.1:8787/test?format=json"
          echo

      - name: 诊断镜像体积构成
        run: |
          echo "===== 基础镜像体积 ====="
          docker pull -q node:20-bookworm-slim >/dev/null
          docker pull -q node:20-bookworm >/dev/null
          docker images --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' | grep -E '^node:20-bookworm'

          echo "===== 最终镜像体积 ====="
          docker images vnts2-ws:smoke --format '{{.Size}}'

          echo "===== 镜像内占用分布 ====="
          docker run --rm --entrypoint sh vnts2-ws:smoke -c '
            echo "--- 顶层目录 ---"
            du -sh /usr/local/lib/node_modules 2>/dev/null
            du -sh /app 2>/dev/null
            echo "--- /app/node_modules 前 12 大 ---"
            du -sh /app/node_modules/* 2>/dev/null | sort -rh | head -12
          '

      - name: 清理
        if: always()
        run: docker rm -f smoke || true

  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    needs: [test, smoke]
    # 仅在推送分支/标签时推送镜像；PR 只做构建与启动验证，不推送到仓库。
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVER_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
