name: 构建 Docker 镜像

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: 运行单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 生成版本号
        run: node scripts/gen-version.js

      - name: 检查版本号生成是否幂等（防构建死循环）
        run: |
          set -euo pipefail
          # wrangler.toml 配置了 [build] command = "node scripts/gen-version.js"，
          # 而 src/version.js 在 wrangler 监视范围内。若该脚本每次都重写文件，
          # 会形成「构建 -> 写文件 -> 触发重建」的无限循环。
          # 这里断言：连续两次运行后文件未被修改。
          before=$(stat -c '%Y' src/version.js)
          sleep 1
          node scripts/gen-version.js
          after=$(stat -c '%Y' src/version.js)
          if [ "$before" != "$after" ]; then
            echo "::error::gen-version.js 会重复写入 src/version.js，将导致 wrangler 构建死循环"
            exit 1
          fi
          echo "gen-version.js 幂等性检查通过（重复运行不写文件）"

      - name: 运行测试
        run: npm test

  smoke:
    name: 容器启动冒烟测试 (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      # 两个架构都验证；任一失败不影响另一个，便于定位问题架构。
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # arm64 在 amd64 runner 上需 QEMU 模拟。
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像到本地
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # load 只支持单平台，因此按矩阵逐个平台构建。
          load: true
          platforms: ${{ matrix.platform }}
          tags: vnts2-ws:smoke
          build-args: |
            SERVER_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: 启动容器并验证 /test 可用
        run: |
          set -euo pipefail
          docker run -d --name smoke --platform ${{ matrix.platform }} -p 8787:8787 \
            -e LOCAL_PROTOCOL=http-wss-proxy \
            -e NETWORKS=default \
            vnts2-ws:smoke

          echo "等待服务就绪（${{ matrix.platform }}）..."
          # arm64 走 QEMU 模拟，workerd 与 esbuild 均为原生二进制，
          # 启动明显慢于 amd64，因此超时给到 180s。
          ok=0
          for i in $(seq 1 180); do
            if curl -sk --max-time 3 "https://127.0.0.1:8787/test?format=json" | grep -q '"WebSocket服务":"正常"'; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" != "1" ]; then
            echo "::error::容器未在超时时间内就绪（${{ matrix.platform }}）"
            echo "----- 容器状态 -----"
            docker ps -a --filter name=smoke || true
            echo "----- 容器日志 -----"
            docker logs smoke 2>&1 || true
            exit 1
          fi

          echo "服务已就绪，/test 响应："
          curl -sk "https://127.0.0.1:8787/test?format=json"
          echo

          echo "----- 校验实际运行架构 -----"
          docker exec smoke node -e "console.log('node arch =', process.arch)"

      - name: 诊断镜像体积构成
        if: matrix.platform == 'linux/amd64'
        run: |
          echo "===== 最终镜像体积 ====="
          docker images vnts2-ws:smoke --format '{{.Size}}'

          echo "===== 镜像内占用分布 ====="
          docker run --rm --entrypoint sh vnts2-ws:smoke -c '
            echo "--- /app/node_modules 前 12 大 ---"
            du -sh /app/node_modules/* 2>/dev/null | sort -rh | head -12
          '

      - name: 清理
        if: always()
        run: docker rm -f smoke || true

  compose:
    name: Compose 互联与白名单验证
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 构建镜像到本地
        run: |
          docker build --build-arg SERVER_COMMIT=${{ github.sha }} -t ghcr.io/virkingz/vnts2-ws:latest .

      - name: 构建测试用客户端镜像
        run: docker build -t vnts2-ws-client -f test/client.Dockerfile test

      - name: 启动 compose（两节点互联 + 白名单 office,lab）
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yaml up -d

          echo "等待两个节点就绪..."
          for port in 8787 8788; do
            ok=0
            for i in $(seq 1 60); do
              if curl -sk --max-time 3 "https://127.0.0.1:$port/test?format=json" | grep -q '"WebSocket服务":"正常"'; then
                ok=1
                break
              fi
              sleep 1
            done
            if [ "$ok" != "1" ]; then
              echo "::error::端口 $port 未在超时时间内就绪"
              docker compose -f docker-compose.yaml logs --no-color || true
              exit 1
            fi
          done
          echo "两个节点均已就绪"

      - name: 验证白名单拒绝未授权网络编号
        run: |
          set -euo pipefail
          # 用一个不在白名单内的编号注册，客户端应无法成功建立连接
          set +e
          out=$(docker run --rm --cap-add NET_ADMIN --device /dev/net/tun \
            --add-host host.docker.internal:host-gateway \
            vnts2-ws-client \
            timeout 20 vnt2_cli -s wss://host.docker.internal:8787 -n notallowed \
              --cert-mode skip --device-id wl-test 2>&1)
          code=$?
          set -e
          echo "----- 客户端输出 -----"
          echo "$out"
          echo "退出码: $code"

          # 期望：注册被拒（服务端返回 400 错误并关闭会话），客户端不会进入已连接状态
          if echo "$out" | grep -qiE "not allowed|不允许|被服务端允许"; then
            echo "白名单生效：未授权网络编号被拒绝"
          else
            echo "::error::白名单未生效，未授权编号未被拒绝"
            exit 1
          fi

      - name: 验证白名单内编号可正常注册
        run: |
          set -euo pipefail
          docker run -d --name wl-ok --cap-add NET_ADMIN --device /dev/net/tun \
            --add-host host.docker.internal:host-gateway \
            vnts2-ws-client \
            vnt2_cli -s wss://host.docker.internal:8787 -n office --ip 10.46.0.2 \
              --cert-mode skip --device-id wl-ok --ctrl-port 11233

          sleep 15
          echo "----- 客户端状态 -----"
          docker exec wl-ok vnt2_ctrl -p 11233 clients || true

          echo "----- 节点 A /room 客户端列表 -----"
          curl -sk "https://127.0.0.1:8787/room?format=json&network=office&gateway=10.46.0.1" | head -c 800
          echo

      - name: 验证跨节点互联
        run: |
          set -euo pipefail
          # 在节点 B 上也注册一个客户端，两个客户端应能互相看到并通过互联通信
          docker run -d --name wl-ok-b --cap-add NET_ADMIN --device /dev/net/tun \
            --add-host host.docker.internal:host-gateway \
            vnts2-ws-client \
            vnt2_cli -s wss://host.docker.internal:8788 -n office --ip 10.46.0.3 \
              --cert-mode skip --device-id wl-ok-b --ctrl-port 11233

          echo "等待互联客户端列表同步..."
          sleep 20

          echo "----- 节点 A 视角（应能看到节点 B 的 10.46.0.3）-----"
          docker exec wl-ok vnt2_ctrl -p 11233 clients || true

          echo "----- 跨节点 ping 10.46.0.3 -----"
          docker exec wl-ok ping -c 4 -W 3 10.46.0.3

          echo "----- 节点 A /test 互联状态 -----"
          curl -sk "https://127.0.0.1:8787/test?format=json"
          echo

      - name: 验证 DO 状态目录落在挂载卷内
        run: |
          set -euo pipefail
          echo "----- 容器内 /data 内容 -----"
          docker compose -f docker-compose.yaml exec -T vnts2-a ls -la /data || true
          # 确认卷确实被写入（应能看到 sqlite 相关文件）
          if docker compose -f docker-compose.yaml exec -T vnts2-a sh -c 'ls -A /data | grep -q .'; then
            echo "持久化目录已写入数据"
          else
            echo "::error::/data 为空，DO 状态未落到挂载卷"
            exit 1
          fi

      - name: 验证容器重建后 DO 数据仍在
        run: |
          set -euo pipefail
          # 关键：先停掉客户端容器，确保重建后不会有客户端重新注册。
          # 这样 /room 里出现的设备只可能来自持久化读回的档案，测试才成立。
          docker rm -f wl-ok wl-ok-b || true

          # 等待服务端把离线状态写盘（离线会触发 persistSoon）
          sleep 8

          before=$(curl -sk "https://127.0.0.1:8787/room?format=json&network=office&gateway=10.46.0.1")
          echo "----- 重建前 /room（应显示离线设备）-----"
          echo "$before" | head -c 600
          echo

          # 重建前先确认卷内确实有数据，否则后面的验证没有意义
          if ! docker compose -f docker-compose.yaml exec -T vnts2-a sh -c 'ls -A /data | grep -q .'; then
            echo "::error::重建前 /data 为空，持久化未生效"
            exit 1
          fi
          echo "重建前 /data 已有数据，开始重建容器"

          # 强制重建容器（模拟"重新部署"），保留命名卷
          docker compose -f docker-compose.yaml up -d --force-recreate

          echo "等待两个节点重新就绪..."
          for port in 8787 8788; do
            ok=0
            for i in $(seq 1 60); do
              if curl -sk --max-time 3 "https://127.0.0.1:$port/test?format=json" | grep -q '"WebSocket服务":"正常"'; then
                ok=1
                break
              fi
              sleep 1
            done
            if [ "$ok" != "1" ]; then
              echo "::error::重建后端口 $port 未就绪"
              docker compose -f docker-compose.yaml logs --no-color || true
              exit 1
            fi
          done

          after=$(curl -sk "https://127.0.0.1:8787/room?format=json&network=office&gateway=10.46.0.1")
          echo "----- 重建后 /room -----"
          echo "$after" | head -c 600
          echo

          # 客户端已停，此时设备若仍在列表中，只能来自持久化档案。
          # 注意：只校验注册到【本节点】的 10.46.0.2。
          # 10.46.0.3 注册在节点 B，属于互联客户端，其缓存会随节点 B 离线而失效，
          # 不应出现在节点 A 的本地设备列表里。
          echo "----- 检查历史设备是否保留 -----"
          if echo "$after" | grep -q "10.46.0.2"; then
            echo "保留: 10.46.0.2（本地设备档案）"
          else
            echo "::error::容器重建后丢失本地设备 10.46.0.2"
            exit 1
          fi

          # 进一步确认真的是完整档案被读回，而不只是 IP 恰好出现。
          # 校验设备 ID，它只在注册时写入并随档案持久化。
          if echo "$after" | grep -q '"设备ID":"wl-ok"'; then
            echo "设备 ID 已随档案恢复"
          else
            echo "::error::设备档案不完整，设备 ID 未恢复"
            exit 1
          fi
          echo "持久化验证通过：客户端已停，容器重建后 DO 仍持有完整设备档案"

      - name: 失败时输出日志
        if: failure()
        run: |
          docker compose -f docker-compose.yaml logs --no-color || true
          docker logs wl-ok 2>&1 || true
          docker logs wl-ok-b 2>&1 || true

      - name: 清理
        if: always()
        run: |
          docker rm -f wl-ok wl-ok-b || true
          docker compose -f docker-compose.yaml down -v || true

  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest

    needs: [test, smoke, compose]
    # 仅在推送分支/标签时推送镜像；PR 只做构建与启动验证，不推送到仓库。
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 QEMU（构建多架构镜像用）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 同时构建 amd64 与 arm64，合并为一个 manifest list，
          # docker pull 时按运行平台自动选择。
          # arm64 走 QEMU 模拟，构建耗时明显长于 amd64。
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVER_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
