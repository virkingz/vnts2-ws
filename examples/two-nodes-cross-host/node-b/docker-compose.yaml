# ===== 节点 B 模板（跨设备互联）=====
#
# 放在【第二台机器】上运行。第一台机器请用 node-a/ 下的模板。
#
# 与 node-a 的唯一差别是 .env 里的 PEER_HOST 填对端（即 node-a）的地址。
#
# 准备（本机）：
#   cp .env.example .env
#   # 编辑 .env，至少填 PEER_HOST 与 SERVER_TOKEN
#   docker compose up -d
#
# 注意：两个模板的端口默认值完全一致（8787 / 18786）。
# 两台机器各自独立部署，端口不会冲突；只有把两个节点放在同一台
# 机器上联调时，才需要把其中一个的 WSS_PORT 与 PEER_PORT 改开。

services:
  vnts2:
    image: ghcr.io/virkingz/vnts2-ws:latest
    container_name: vnts2-b
    restart: unless-stopped
    environment:
      # 本地 Docker 模式：容器内 Worker 监听 8786(HTTP)，8787 暴露 WSS
      LOCAL_PROTOCOL: http-wss-proxy
      INTERNAL_PORT: "8786"
      PUBLIC_PORT: "8787"

      # ===== 网络编号白名单 =====
      # 与 node-a 保持一致，避免同一网络只存在于一端。
      NETWORKS: "${NETWORKS:-office,lab}"

      # ===== 互联 =====
      # 必须与 node-a 填入完全相同的非空令牌。
      SERVER_TOKEN: "${SERVER_TOKEN:?请在 .env 中设置 SERVER_TOKEN，两个节点必须一致}"
      # 对端地址（必填）：node-b 填 node-a 的地址
      PEER_SERVERS: "${PEER_HOST:?请在 .env 中设置 PEER_HOST 为对端地址}"

      # ===== 可选 =====
      LEASE_DURATION: "${LEASE_DURATION:-86400}"
      MAINTENANCE_INTERVAL: "${MAINTENANCE_INTERVAL:-15}"
      DISABLE_RELAY: "${DISABLE_RELAY:-0}"
      LOG_LEVEL: "${LOG_LEVEL:-off}"
      LOG_PASSWORD: "${LOG_PASSWORD:-}"
      TEST_PASSWORD: "${TEST_PASSWORD:-}"

      PERSIST_TO: /data

      # 互联走 https:// 自签证书时必需：指向容器内的 CA 证书；走 http:// 时留空。
      NODE_EXTRA_CA_CERTS: "${NODE_EXTRA_CA_CERTS:-}"
    volumes:
      - vnts2-data:/data
      # 可选：自签 CA 证书，启用 https 互联时取消注释
      # - ./certs/ca.crt:/certs/ca.crt:ro
    ports:
      # 客户端接入端口。
      # 两台机器各自独立，端口不会冲突，因此与 node-a 保持一致即可。
      # 仅当你把两个节点放在【同一台机器】上联调时，才需要改成 8788。
      - "${WSS_PORT:-8787}:8787"
      # 互联端口，供对端节点访问。同理，独立部署时与 node-a 一致为 18786。
      - "${PEER_BIND_IP:-0.0.0.0}:${PEER_PORT:-18786}:8786"
    # 不配置 healthcheck，理由见 node-a/docker-compose.yaml 的说明。

volumes:
  vnts2-data:

# ⚠️ 安全提示：与 node-a 相同，互联端口为明文 HTTP，仅靠 SERVER_TOKEN 鉴权。
# 请用长随机令牌，并用防火墙限制互联端口仅对端 IP 可访问。
